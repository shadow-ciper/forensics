# ============================================================
# IR PLAYBOOK SNORT CONFIG — dns-remoteshell.pcap
# Minimal custom config for detecting remote shell attacks
# ============================================================

# --- Network Variables ---
# Note: Attacker (192.168.1.3) is internal, so we use specific IPs
var HOME_NET 192.168.1.0/24
var EXTERNAL_NET !$HOME_NET
var ATTACKER 192.168.1.3
var VICTIM 192.168.1.2

# --- Dynamic Engine & Preprocessors ---
dynamicengine /usr/lib/snort_dynamicengine/libsf_engine.so
dynamicpreprocessor directory /usr/lib/snort_dynamicpreprocessor/

# --- Preprocessors ---
preprocessor stream5_global: track_tcp yes, track_udp yes, track_ip no
preprocessor stream5_tcp: policy windows, overlap_limit 10, timeout 180
preprocessor stream5_udp: timeout 180

preprocessor http_inspect: global iis_unicode_map /etc/snort/unicode.map 1252 compress_depth 65535 decompress_depth 65535
preprocessor http_inspect_server: server default \
    ports { 80 } \
    server_flow_depth 0 \
    client_flow_depth 0 \
    post_depth 65495 \
    oversize_dir_length 500 \
    max_header_length 750 \
    max_headers 100 \
    normalize_headers \
    normalize_cookies \
    enable_cookie

preprocessor dns: ports { 53 } enable_rdata_overflow

preprocessor ftp_telnet: global inspection_type stateful encrypted_traffic yes
preprocessor ftp_telnet_protocol: telnet normalize ports { 23 }
preprocessor ftp_telnet_protocol: ftp server default ports { 21 } def_max_param_len 100
preprocessor ftp_telnet_protocol: ftp client default max_resp_len 256 bounce yes

# --- Classification ---
include /etc/snort/classification.config

# --- Output ---
output alert_fast: stdout

# --- Rules ---
include /home/shadowciper/Cybersec/Networkforensics/virusandworm/dns-remoteshell.rules
